<app-content-card [width]="'60%'" [backgroundOpacity]="0.95">
  <div class="separator"></div>
  @if (isEventValid()) {
    <app-event-card #eventCard [event]="event()" [expanded]="true"/>
  } @else {
    <app-quote-strip-simple
      [id]="'noValidEvent'"
      [quote]="invalidQuote"
    />
  }
  <div class="separator"></div>
</app-content-card>
