<app-content-card [backgroundOpacity]="backgroundOpacity()" [passthrough]="embedded()">
  <section
    class="pricing-section"
    [class.pricing-section--embedded]="embedded()"
    [attr.id]="sectionId() || null"
  >
    @if (tableTitle() || data().title) {
      <h2>{{ tableTitle() || data().title }}</h2>
    }
    @if (data().introHtml && !hasProjectedContent()) {
      <div [innerHTML]="data().introHtml"></div>
    }
    <div #projectedContent class="pricing-section__projected-content">
      <ng-content></ng-content>
    </div>
    <app-table [data]="data()"/>
  </section>
</app-content-card>
