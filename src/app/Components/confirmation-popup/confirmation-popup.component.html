<div class="confirmation-popup">
  <div class="popup-content">
    <ng-content></ng-content>
  </div>

  <div class="button-group">
    <button
      type="button"
      class="confirm-button"
      [style]="{ backgroundColor: AppColors.success, color: AppColors.textOnOrange }"
      (click)="onConfirmClick()"
    >
      {{ T.confirmation_yes | text }}
    </button>
    <button
      type="button"
      class="cancel-button"
      [style]="{ backgroundColor: AppColors.danger, color: AppColors.textOnOrange }"
      (click)="onCancelClick()"
    >
      {{ T.confirmation_no | text }}
    </button>
  </div>
</div>
